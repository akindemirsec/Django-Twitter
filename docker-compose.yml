services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./twitter_clone:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  react:
    build:
      context: ./twitter-clone-frontend
      dockerfile: Dockerfile
    volumes:
      - ./twitter-clone-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
